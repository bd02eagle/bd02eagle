
<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet" />
  <link href="./css/main.css" rel="stylesheet" />
  <title>RefIntel - Home</title>
</head>
<body>
  <div class="landing-container">
    <div class="landing-header">
      <h1>RefIntel</h1>
      <p>Professional referee evaluation and analysis platform</p>
    </div>
    
    <div class="landing-actions">
      <button class="action-btn primary" onclick="window.location.href='/my-games.html'">
        Go to My Games
      </button>
      <button class="action-btn secondary" onclick="window.location.href='/workspace.html'">
        Evaluation Workspace
      </button>
    </div>
  </div>

  <script>
    // Auto-redirect if user has auth token
    if (localStorage.getItem('authToken')) {
      window.location.href = '/my-games.html';
    }
  </script>
</body>
</html>
