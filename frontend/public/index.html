
<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet" />
  <link href="./css/main.css" rel="stylesheet" />
  <title>RefIntel - Evaluation Workspace</title>
</head>
<body>
  <div class="v1_4">
    <div class="v1_5">
      <div class="v1_6">
        <!-- Sidebar -->
        <div class="v1_7">
          <div class="v1_9">
            <span class="v1_15">RefIntel</span>
          </div>
          <div class="v1_10">
            <!-- My Games -->
            <span class="v1_23">My Games</span>
            <div class="v1_24">
              <div class="v1_25">
                <div class="v1_26"></div>
              </div>
            </div>
            <!-- Evaluation Workspace -->
            <div class="v1_21">
              <div class="v1_42">
                <div class="v1_56">
                  <div class="v1_57">
                    <div class="v1_58"></div>
                  </div>
                </div>
              </div>
              <span class="v1_44">Evaluation Workspace</span>
            </div>
            <!-- Review Management -->
            <span class="v1_33">Review Management</span>
            <div class="v1_34">
              <div class="v1_35">
                <div class="v1_36"></div>
              </div>
            </div>
            <!-- Exports -->
            <span class="v1_28">Exports</span>
            <div class="v1_29">
              <div class="v1_30">
                <div class="v1_31"></div>
              </div>
            </div>
          </div>
          <!-- User Profile -->
          <div class="v1_11">
            <div class="v1_37">
              <div class="v1_45"></div>
              <div class="v1_46">
                <span class="v1_60">Ref Analyst 1</span>
                <span class="v1_62">RefIntel Analyst</span>
              </div>
            </div>
          </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="v1_8">
          <!-- Header -->
          <div class="v1_12">
            <div class="v1_38">
              <span class="v1_48">Evaluation: SC vs. TX</span>
              <div class="v1_49">
                <span class="v1_64">PUBLISHED</span>
              </div>
            </div>
            <div class="v1_39">
              <div class="v1_50">
                <span class="v1_66">Tagging Progress</span>
                <span class="v1_68">42 of 128 tagged</span>
              </div>
              <div class="v1_51">
                <div class="v1_69"></div>
              </div>
            </div>
          </div>
          
          <!-- Filters and Content -->
          <div class="v1_13">
            <div class="v1_40">
              <div class="v1_52">
                <span class="v1_71">Filters</span>
              </div>
              <!-- Filter controls will be added here -->
              <div class="v1_75">
                <div class="v1_87">
                  <span class="v1_88">Event Type</span>
                  <div class="v1_90">
                    <div class="v1_91"></div>
                  </div>
                </div>
                <div class="v1_92">
                  <span class="v1_93">Status</span>
                  <div class="v1_96">
                    <div class="v1_97"></div>
                  </div>
                </div>
              </div>
            </div>
            
            <!-- Event List Area -->
            <div id="event-list" class="event-list">
              <!-- Events will be loaded here via JavaScript -->
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="./js/app.js"></script>
</body>
</html>
