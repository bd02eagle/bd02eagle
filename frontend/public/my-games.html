<!DOCTYPE html>
<html>
<head>
  <link href="https://fonts.googleapis.com/css?family=Inter&display=swap" rel="stylesheet" />
  <link href="./css/my-games.css" rel="stylesheet" />
  <title>RefIntel - My Games</title>
</head>
<body>
  <div class="v1_461">
    <!-- Sidebar -->
    <div class="v1_464">
      <div class="v1_489">
        <div class="v1_504">
          <span class="v1_515">RefIntel</span>
        </div>
        <div class="v1_505">
          <span class="v1_23">My Games</span>
          <div class="v1_24">
            <div class="v1_25">
              <div class="v1_26"></div>
            </div>
          </div>
          <span class="v1_28">Evaluation Workspace</span>
          <div class="v1_29">
            <div class="v1_30">
              <div class="v1_31"></div>
            </div>
          </div>
          <span class="v1_33">Review Management</span>
          <div class="v1_34">
            <div class="v1_35">
              <div class="v1_36"></div>
            </div>
          </div>
          <span class="v1_516">Exports</span>
        </div>
      </div>

      <!-- User Profile -->
      <div class="v1_490">
        <div class="v1_507">
          <div class="v1_508"></div>
          <div class="v1_509">
            <span class="v1_510">Ref Analyst 1</span>
            <span class="v1_512">RefIntel Analyst</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Content -->
    <div class="v1_462">
      <!-- Header -->
      <div class="v1_465">
        <span class="v1_491">My Games</span>
      </div>

      <!-- Stats Cards -->
      <div class="v1_466">
        <div class="v1_492">
          <div class="v1_500">
            <span class="v1_517">Assigned Games</span>
            <span class="v1_518" id="assigned-games-count">0</span>
          </div>
        </div>
        <div class="v1_493">
          <div class="v1_501">
            <span class="v1_519">In Progress</span>
            <span class="v1_520" id="in-progress-count">0</span>
          </div>
        </div>
        <div class="v1_494">
          <div class="v1_502">
            <span class="v1_521">Completed Today</span>
            <span class="v1_522" id="completed-count">0</span>
          </div>
        </div>
      </div>

      <!-- Games List -->
      <div class="v1_467">
        <div class="v1_495">
          <span class="v1_503">My Assigned Games</span>
        </div>
        <div class="v1_496">
          <div class="v1_523">
            <span class="v1_524">Game</span>
            <span class="v1_525">Date</span>
            <span class="v1_526">Tags Pending</span>
            <span class="v1_527">Progress</span>
            <span class="v1_528">Priority</span>
            <span class="v1_529">Actions</span>
          </div>
          <div id="games-container">
            <div class="loading">Loading your assigned games...</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="./js/my-games.js"></script>
</body>
</html>
